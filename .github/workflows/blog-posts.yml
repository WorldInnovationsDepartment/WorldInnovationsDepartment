# Refreshes the "Latest writing" list from danylovorvul.com/feed.rss every 6 hours.
# Rewrites only the lines between the BLOG-POST-LIST markers and commits when they change.
name: Latest blog posts

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://danylovorvul.com/feed.rss"
          max_post_count: 5
          commit_message: "Update latest writing"
          enable_keepalive: false
